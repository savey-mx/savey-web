<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuestionario de diseño · Savey</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#F7F2EA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --marfil:#F7F2EA; --blanco:#FFFDFC; --espresso:#332B27; --suave:#6E625B;
  --champagne:#C7A77A; --rosa:#CDA9A5; --exito:#5B7A5B;
  --borde:rgba(51,43,39,.12); --fino:rgba(51,43,39,.07);
  --serif:'Instrument Serif',Georgia,serif;
  --sans:'Instrument Sans',system-ui,-apple-system,sans-serif;
  --curva:cubic-bezier(.22,.61,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--marfil);color:var(--espresso);font-family:var(--sans);
  font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
svg{display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--champagne);outline-offset:2px;border-radius:4px}
.env{max-width:640px;margin:0 auto;padding:0 20px}

/* ── Encabezado y avance ── */
header{position:sticky;top:0;z-index:20;background:rgba(247,242,234,.94);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--borde)}
.cab{display:flex;align-items:center;gap:12px;padding:14px 0 12px}
.marca{font-family:var(--serif);font-size:22px;display:flex;align-items:center;gap:7px}
.marca svg{width:11px;height:11px;fill:var(--champagne)}
.cab .paso-n{margin-left:auto;font-size:12.5px;color:var(--suave);font-variant-numeric:tabular-nums}
.barra{height:3px;background:var(--fino);border-radius:99px;overflow:hidden;margin-bottom:12px}
.barra i{display:block;height:100%;width:0;background:var(--champagne);
  transition:width .5s var(--curva);border-radius:99px}

main{padding:32px 0 40px}
h1{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.16;letter-spacing:-.015em}
.bajada{color:var(--suave);margin-top:8px;font-size:14.5px}
.bloque{margin-top:26px;display:grid;gap:18px}

/* ── Campos ── */
label.rot{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--suave);margin-bottom:7px;font-weight:500}
.req{color:var(--rosa)}
input,select,textarea{width:100%;padding:12px 13px;background:var(--blanco);
  border:1px solid var(--borde);color:var(--espresso);font-family:var(--sans);
  font-size:16px;border-radius:8px;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--suave) 50%),
  linear-gradient(135deg,var(--suave) 50%,transparent 50%);
  background-position:calc(100% - 19px) 51%,calc(100% - 13px) 51%;
  background-size:6px 6px;background-repeat:no-repeat;padding-right:38px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--champagne)}
textarea{min-height:92px;resize:vertical;line-height:1.55}
.ayuda{font-size:12.5px;color:var(--suave);margin-top:6px}
.par{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.par{grid-template-columns:1fr}}

/* ── Tarjetas de opción ── */
.tarjetas{display:grid;gap:10px}
.tarjeta{position:relative;background:var(--blanco);border:1px solid var(--borde);
  border-radius:12px;padding:16px 17px;cursor:pointer;display:block;
  transition:border-color .3s var(--curva),background .3s var(--curva)}
.tarjeta:hover{border-color:var(--champagne)}
.tarjeta input{position:absolute;opacity:0;pointer-events:none}
.tarjeta .fila{display:flex;align-items:baseline;gap:10px}
.tarjeta b{font-family:var(--serif);font-weight:400;font-size:21px;line-height:1.2}
.tarjeta .precio{margin-left:auto;font-family:var(--serif);font-size:19px;white-space:nowrap}
.tarjeta p{font-size:13.5px;color:var(--suave);margin-top:5px;line-height:1.5}
.tarjeta:has(input:checked){border-color:var(--champagne);
  background:linear-gradient(180deg,rgba(199,167,122,.12),rgba(199,167,122,.03)),var(--blanco)}
.tarjeta:has(input:checked)::after{content:"";position:absolute;top:15px;right:15px;
  width:8px;height:8px;background:var(--champagne);transform:rotate(45deg)}
.tarjeta.chica b{font-size:17px}

/* ── Casillas múltiples ── */
.casillas{display:grid;gap:8px}
.casilla{display:flex;gap:11px;align-items:flex-start;background:var(--blanco);
  border:1px solid var(--borde);border-radius:10px;padding:13px 14px;cursor:pointer;
  transition:border-color .3s var(--curva)}
.casilla:hover{border-color:var(--champagne)}
.casilla input{width:17px;height:17px;flex:none;margin-top:2px;accent-color:var(--champagne);
  -webkit-appearance:auto;appearance:auto;padding:0}
.casilla b{font-weight:500;font-size:15px;display:block}
.casilla span{font-size:13px;color:var(--suave);display:block;line-height:1.45}
.casilla:has(input:checked){border-color:var(--champagne);background:rgba(199,167,122,.08)}

/* ── Navegación ── */
.pies{display:flex;gap:10px;margin-top:30px;padding-top:22px;border-top:1px solid var(--borde)}
.bt{height:52px;padding:0 26px;border:0;border-radius:8px;font-family:var(--sans);
  font-weight:500;font-size:15.5px;cursor:pointer;transition:background .3s var(--curva),transform .3s var(--curva)}
.bt-ir{background:var(--espresso);color:var(--marfil);flex:1}
.bt-ir:hover{background:#241B12;transform:translateY(-1px)}
.bt-atras{background:transparent;border:1px solid var(--borde);color:var(--espresso)}
.bt-atras:hover{border-color:var(--champagne)}
.bt-enviar{background:var(--champagne);color:var(--espresso);flex:1}
.bt-enviar:hover{background:#BB9A6C}
.bt:disabled{opacity:.55;cursor:default;transform:none}

/* ── Revisión ── */
.resumen{background:var(--blanco);border:1px solid var(--fino);border-radius:12px;
  padding:6px 18px;margin-top:20px}
.resumen .r{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--fino);font-size:14px}
.resumen .r:last-child{border-bottom:0}
.resumen .r .k{color:var(--suave);flex:0 0 40%}
.resumen .r .v{flex:1;font-weight:500;word-break:break-word}

.alerta{background:rgba(205,169,165,.16);border:1px solid rgba(205,169,165,.5);
  border-radius:10px;padding:13px 15px;font-size:13.5px;margin-top:16px;color:var(--espresso)}
.guardado{font-size:12.5px;color:var(--suave);margin-top:14px;text-align:center;min-height:18px}

/* ── Fin ── */
.fin{text-align:center;padding:50px 0}
.fin svg{width:34px;height:34px;fill:var(--champagne);margin:0 auto 18px}
.fin h1{font-size:32px}
.folio{display:inline-block;margin-top:18px;padding:9px 20px;background:var(--blanco);
  border:1px solid var(--borde);border-radius:99px;font-family:var(--serif);font-size:19px;letter-spacing:.06em}
.wa{display:inline-flex;align-items:center;justify-content:center;gap:9px;margin-top:24px;
  height:54px;padding:0 26px;border-radius:8px;background:var(--champagne);color:var(--espresso);
  text-decoration:none;font-weight:500}
.wa svg{width:18px;height:18px;fill:currentColor;margin:0}

footer{padding:26px 0 40px;text-align:center;font-size:12px;color:var(--suave)}
.oculto{display:none!important}
</style>
</head>

  <div class="env">

/* ══════════════════ Los pasos ══════════════════ */

function evalua(v){ return typeof v === 'function' ? v() : v }

  var id = 'f_'+c.k;
  var val = D[c.k] || '';
  var h = '<div>';
  if(c.tipo !== 'tarjetas' && c.tipo !== 'casillas')
    h += '<label class="rot" for="'+id+'">'+rot+(c.req?' <span class="req">*</span>':'')+'</label>';
  else if(rot)
    h += '<label class="rot">'+rot+(c.req?' <span class="req">*</span>':'')+'</label>';

  if(c.tipo==='tarjetas'){
    h += '<div class="tarjetas">';
    c.op.forEach(function(o,n){
      var v = o.v||o, chica = !o.precio && !o.d ? ' chica' : '';
      h += '<label class="tarjeta'+chica+'"><input type="radio" name="'+c.k+'" value="'+v+'"'+
           (val===v?' checked':'')+'><div class="fila"><b>'+v+'</b>'+
           (o.precio?'<span class="precio">'+o.precio+'</span>':'')+'</div>'+
           (o.d?'<p>'+o.d+'</p>':'')+'</label>';
    });
    h += '</div>';
  } else if(c.tipo==='casillas'){
    var marcadas = (val||'').split(' · ');
    h += '<div class="casillas">';
    c.op.forEach(function(o){
      var v=o.v||o;
      h += '<label class="casilla"><input type="checkbox" name="'+c.k+'" value="'+v+'"'+
           (marcadas.indexOf(v)>=0?' checked':'')+'><span><b>'+v+'</b>'+
           (o.d?'<span>'+o.d+'</span>':'')+'</span></label>';
    });
    h += '</div>';
  } else if(c.tipo==='select'){
    h += '<select id="'+id+'" name="'+c.k+'"><option value="">Elige una opción</option>';
    c.op.forEach(function(o){ h += '<option'+(val===o?' selected':'')+'>'+o+'</option>' });
    h += '</select>';
  } else if(c.tipo==='larga'){
    h += '<textarea id="'+id+'" name="'+c.k+'">'+val+'</textarea>';
  } else {
    var t = {texto:'text',tel:'tel',correo:'email',fecha:'date',hora:'time',num:'number'}[c.tipo]||'text';
    h += '<input id="'+id+'" name="'+c.k+'" type="'+t+'" value="'+String(val).replace(/"/g,'&quot;')+'">';
  }
  if(ayuda) h += '<div class="ayuda">'+ayuda+'</div>';
  return h + '</div>';
}

function pinta(){
  var lista = visibles(), p = lista[i];
  var tot = lista.length;
  $('paso-n').textContent = 'Paso '+(i+1)+' de '+tot;
  $('avance').style.width = ((i)/(tot-1)*100)+'%';

  var h = '<h1>'+p.t+'</h1>'+(p.b?'<p class="bajada">'+p.b+'</p>':'');
  if(p.revision){
    h += '<div class="resumen">';
    lista.forEach(function(pp){
      (pp.campos||[]).forEach(function(c){
        if(c.si && !c.si()) return;
        var v = D[c.k]; if(!v) return;
        h += '<div class="r"><div class="k">'+(evalua(c.rot)||c.k)+'</div><div class="v">'+
             String(v).replace(/</g,'&lt;').replace(/\n/g,'<br>')+'</div></div>';
      });
    });
    h += '</div><div class="alerta">Al enviar, tus respuestas llegan directo a nuestro tablero. '+
         'Después te escribimos por WhatsApp para pedirte las fotos y cerrar los últimos detalles.</div>';
  } else {
    h += '<div class="bloque">';
    p.campos.forEach(function(c){ if(!c.si || c.si()) h += campo(c) });
    h += '</div>';
  }
  $('lienzo').innerHTML = h;

  $('atras').classList.toggle('oculto', i===0);
  $('ir').textContent = p.revision ? 'Enviar cuestionario' : (i===0 ? 'Continuar' : 'Continuar');
  $('ir').className = 'bt ' + (p.revision ? 'bt-enviar' : 'bt-ir');
  window.scrollTo({top:0,behavior:'smooth'});

  // los cambios se recogen al vuelo
  $('lienzo').addEventListener('input', recoge);
  $('lienzo').addEventListener('change', function(e){ recoge(); if(e.target.type==='radio'||e.target.tagName==='SELECT') pinta() });
}

function recoge(){
  var l = $('lienzo');
  Array.prototype.forEach.call(l.querySelectorAll('input,select,textarea'), function(el){
    if(el.type==='radio'){ if(el.checked) D[el.name]=el.value }
    else if(el.type==='checkbox'){
      var m = Array.prototype.filter.call(l.querySelectorAll('input[name="'+el.name+'"]:checked'),
              function(x){return true}).map(function(x){return x.value});
      D[el.name] = m.join(' · ');
    }
    else D[el.name] = el.value;
  });
  guardar();
}

function valida(){
  var p = visibles()[i]; var falta = null;
  (p.campos||[]).forEach(function(c){
    if(falta) return;
    if(c.si && !c.si()) return;
    if(c.req && !D[c.k]) falta = c;
  });
  if(falta){
    var el = document.getElementById('f_'+falta.k) ||
             $('lienzo').querySelector('[name="'+falta.k+'"]');
    if(el){ el.scrollIntoView({behavior:'smooth',block:'center'});
            try{ el.focus() }catch(e){}
            el.style.borderColor = '#CDA9A5'; }
    return false;
  }
  return true;
}

$('ir').addEventListener('click', function(){
  recoge();
  var p = visibles()[i];
  if(p.revision){ enviar(); return }
  if(!valida()) return;
  if(i < visibles().length-1){ i++; pinta() }
});
$('atras').addEventListener('click', function(){ recoge(); if(i>0){ i--; pinta() } });

/* ══════════════════ Envío ══════════════════ */
function folio(){
  var L="ABCDEFGHJKLMNPQRSTUVWXYZ23456789", s="";
  for(var n=0;n<5;n++) s+=L.charAt(Math.floor(Math.random()*L.length));
  return s;
}
function enviar(){
  var b = $('ir'); b.disabled = true; b.textContent = 'Enviando…';
  D.folio = folio();
  D.enviado = new Date().toISOString();
  D.origen = location.href;

  var listo = function(){
    try{ localStorage.removeItem('savey-brief') }catch(e){}
    var texto = 'Hola, ya llené el cuestionario de Savey. Mi folio es '+D.folio+
                ' — '+(D.evento||'')+' de '+(D.nombres||'')+'.';
    document.body.innerHTML =
      '<div class="env fin"><svg><use href="#ch"/></svg>'+
      '<h1>Listo, ya lo recibimos</h1>'+
      '<p class="bajada" style="max-width:34ch;margin:10px auto 0">Guarda tu folio. Te escribimos por WhatsApp '+
      'en las próximas horas para pedirte las fotos y confirmar los últimos detalles.</p>'+
      '<div class="folio">'+D.folio+'</div><br>'+
      '<a class="wa" href="https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(texto)+'">'+
      '<svg><use href="#wa"/></svg>Mandar mis fotos por WhatsApp</a>'+
      '<footer>Savey · saveystudio.com</footer></div>' +
      document.querySelector('svg[width="0"]').outerHTML;
  };

  if(ENDPOINT){
    fetch(ENDPOINT, {method:'POST', mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(D)}).then(listo)['catch'](listo);
  } else {
    // sin endpoint configurado: el resumen se va por WhatsApp
    var res = Object.keys(D).filter(function(k){return D[k]})
      .map(function(k){ return k+': '+D[k] }).join('\n');
    window.open('https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent('CUESTIONARIO SAVEY\n\n'+res),'_blank');
    listo();
  }
}

recuperar();
pinta();
})();
</script>
</body>
