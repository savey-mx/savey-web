<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.ico?v=3" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<link rel="manifest" href="/site.webmanifest">
<title>Cotiza tu evento · Savey</title>
<meta name="description" content="Cuéntanos de tu evento y te escribimos por WhatsApp con tu cotización.">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#F7F2EA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --marfil:#F7F2EA; --blanco:#FFFDFC; --espresso:#332B27; --suave:#6E625B;
  --champagne:#C7A77A; --champagne-os:#BB9A6C; --rosa:#CDA9A5; --exito:#5B7A5B; --wa:#1FA855;
  --borde:rgba(51,43,39,.12); --fino:rgba(51,43,39,.07);
  --serif:'Instrument Serif',Georgia,serif;
  --sans:'Instrument Sans',system-ui,-apple-system,sans-serif;
  --curva:cubic-bezier(.22,.61,.36,1);
  --resorte:cubic-bezier(.34,1.45,.5,1);
  --plata:linear-gradient(125deg,#F5F6F8,#CDD1D7 30%,#F1F2F4 50%,#AFB5BD 75%,#E6E8EB);
  --oro:linear-gradient(125deg,#F8EAC6,#D6B26C 30%,#F4DFAB 50%,#B78B42 75%,#EBD199);
  --diamante:linear-gradient(125deg,#F4F7FB,#DCE5F1 25%,#F7EEF3 45%,#E2F2EE 65%,#D9DFF0);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--marfil);color:var(--espresso);font-family:var(--sans);
  font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;top:-25vmax;right:-20vmax;width:60vmax;height:60vmax;pointer-events:none;z-index:-1;
  background:radial-gradient(circle,rgba(199,167,122,.2),transparent 62%)}
body::after{content:"";position:fixed;bottom:-30vmax;left:-25vmax;width:60vmax;height:60vmax;pointer-events:none;z-index:-1;
  background:radial-gradient(circle,rgba(205,169,165,.16),transparent 62%)}
svg{display:block}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--champagne);outline-offset:2px;border-radius:6px}
.oculto{display:none!important}

/* ══════════ Encabezado ══════════ */
header{position:sticky;top:0;z-index:20;background:rgba(247,242,234,.86);
  -webkit-backdrop-filter:saturate(170%) blur(14px);backdrop-filter:saturate(170%) blur(14px);
  border-bottom:1px solid var(--fino)}
.cab{max-width:1080px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:14px}
.marca{font-family:var(--serif);font-size:23px;display:flex;align-items:center;gap:7px;text-decoration:none;line-height:1}
.marca svg{width:11px;height:11px;fill:var(--champagne);transition:transform .6s var(--resorte)}
.marca:hover svg{transform:rotate(90deg) scale(1.2)}
.cab-paso{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--suave)}
.cab-paso b{font-weight:500;color:var(--espresso)}
.anillo{width:30px;height:30px;transform:rotate(-90deg)}
.anillo circle{fill:none;stroke-width:3}
.anillo .base{stroke:var(--fino)}
.anillo .lleno{stroke:var(--champagne);stroke-linecap:round;stroke-dasharray:81.7;stroke-dashoffset:81.7;
  transition:stroke-dashoffset .7s var(--curva)}
.avance{height:2px;background:transparent;position:relative}
.avance i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--champagne),#E2C79B);
  transition:width .7s var(--curva);box-shadow:0 0 12px rgba(199,167,122,.7)}

/* ══════════ Distribución ══════════ */
.env{max-width:1080px;margin:0 auto;padding:0 20px;display:grid;gap:48px}
@media (min-width:62rem){.env{grid-template-columns:minmax(0,600px) 1fr;gap:72px;align-items:start}}
main{padding:40px 0 60px;min-width:0}
.vista{position:sticky;top:100px;padding-top:48px;display:none}
@media (min-width:62rem){.vista{display:block}}

h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,5vw,40px);line-height:1.08;letter-spacing:-.02em}
.bajada{color:var(--suave);margin-top:10px;font-size:15px;max-width:46ch}
.bloque{margin-top:30px;display:grid;gap:22px}

/* ══════════ Portada del cuestionario ══════════ */
.bienvenida h1{font-size:clamp(38px,7vw,56px);line-height:1}
.bienvenida .bajada{font-size:16.5px;margin-top:16px}
.promesas{list-style:none;display:grid;gap:10px;margin-top:30px}
.promesas li{display:flex;align-items:center;gap:14px;background:var(--blanco);border:1px solid var(--fino);
  border-radius:14px;padding:14px 16px;font-size:14.5px;animation:entra .7s var(--curva) both;animation-delay:calc(var(--i) * 90ms + 150ms)}
.promesas .ico{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;background:rgba(199,167,122,.15)}
.promesas .ico svg{width:19px;height:19px;stroke:#9C7A4A;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.promesas .ico.wa{background:rgba(31,168,85,.12)}
.promesas .ico.wa svg{fill:var(--wa);stroke:none}
.promesas b{font-weight:600;display:block;color:var(--espresso)}
.promesas b+span{color:var(--suave);font-size:13px;display:block}
.elegido{display:inline-flex;align-items:center;gap:8px;margin-top:22px;padding:6px 14px 6px 6px;border-radius:99px;
  background:var(--blanco);border:1px solid var(--borde);font-size:13.5px}
.elegido i{width:22px;height:22px;border-radius:50%;background:var(--metal)}

/* ══════════ Campos ══════════ */
.campo{animation:entra .6s var(--curva) both;animation-delay:calc(var(--i,0) * 55ms)}
.sin-anim .campo,.sin-anim .promesas li{animation:none}
@keyframes entra{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
label.rot,.rot{display:block;font-size:13.5px;color:var(--espresso);margin-bottom:8px;font-weight:500}
.req{color:var(--champagne-os);margin-left:2px}
input,select,textarea{width:100%;padding:14px 15px;background:var(--blanco);
  border:1px solid var(--borde);color:var(--espresso);font-family:var(--sans);
  font-size:16px;border-radius:12px;-webkit-appearance:none;appearance:none;
  transition:border-color .25s,box-shadow .25s,background .25s}
input::placeholder,textarea::placeholder{color:rgba(110,98,91,.55)}
input:hover,textarea:hover{border-color:rgba(51,43,39,.22)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--champagne);box-shadow:0 0 0 4px rgba(199,167,122,.18)}
textarea{min-height:100px;resize:vertical;line-height:1.55}
input[type=date],input[type=time]{min-height:52px}
.ayuda{font-size:12.5px;color:var(--suave);margin-top:7px;line-height:1.5}
.error{font-size:12.5px;color:#A2524B;margin-top:7px;display:flex;align-items:center;gap:6px}
.error::before{content:"";width:6px;height:6px;border-radius:50%;background:#C9776E;flex:none}
.falta input,.falta textarea,.falta .tel-caja{border-color:#D29C95!important;box-shadow:0 0 0 4px rgba(205,169,165,.2)}
.sacude{animation:sacude .45s var(--curva)}
@keyframes sacude{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.par{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:440px){.par{grid-template-columns:1fr}}

/* WhatsApp */
.tel-caja{display:flex;align-items:center;background:var(--blanco);border:1px solid var(--borde);border-radius:12px;
  transition:border-color .25s,box-shadow .25s;overflow:hidden}
.tel-caja:focus-within{border-color:var(--champagne);box-shadow:0 0 0 4px rgba(199,167,122,.18)}
.tel-caja.valido{border-color:rgba(31,168,85,.5)}
.lada{display:flex;align-items:center;gap:7px;padding:0 12px 0 14px;height:52px;border-right:1px solid var(--fino);
  font-size:15px;font-weight:500;flex:none;background:rgba(31,168,85,.06)}
.lada svg{width:18px;height:18px;fill:var(--wa)}
.tel-caja input{border:0;box-shadow:none!important;border-radius:0;background:transparent;font-size:17px;letter-spacing:.02em}
.tel-ok{width:24px;height:24px;border-radius:50%;background:var(--wa);margin-right:12px;flex:none;display:grid;place-items:center;
  transform:scale(0);transition:transform .45s var(--resorte)}
.tel-ok svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.valido .tel-ok{transform:scale(1)}
.nota-wa{display:flex;gap:10px;align-items:flex-start;margin-top:10px;padding:11px 13px;border-radius:12px;
  background:rgba(31,168,85,.07);border:1px solid rgba(31,168,85,.18);font-size:13px;line-height:1.5}
.nota-wa svg{width:16px;height:16px;fill:var(--wa);flex:none;margin-top:2px}
.enlace{background:none;border:0;cursor:pointer;font-size:12.5px;color:var(--suave);text-decoration:underline;
  text-decoration-color:var(--champagne);text-underline-offset:3px;margin-top:8px;padding:0}
.enlace:hover{color:var(--espresso)}

/* ══════════ Tarjetas de opción ══════════ */
.tarjetas{display:grid;gap:12px}
.tarjetas.rejilla{grid-template-columns:1fr 1fr}
@media (max-width:480px){.tarjeta.con-ico{padding:14px}.tarjeta.con-ico b{font-size:16.5px}.tarjeta.con-ico .sel{top:13px;right:12px}}
@media (max-width:340px){.tarjetas.rejilla{grid-template-columns:1fr}}
.tarjeta{position:relative;background:var(--blanco);border:1px solid var(--borde);
  border-radius:16px;padding:18px 18px 17px;cursor:pointer;display:block;overflow:hidden;isolation:isolate;
  transition:border-color .3s var(--curva),transform .4s var(--resorte),box-shadow .35s var(--curva)}
.tarjeta:hover{border-color:rgba(199,167,122,.7);transform:translateY(-2px);box-shadow:0 14px 30px -20px rgba(51,43,39,.4)}
.tarjeta:active{transform:scale(.985)}
.tarjeta input{position:absolute;opacity:0;pointer-events:none}
.tarjeta .fila{display:flex;align-items:center;gap:11px;padding-right:30px}
.tarjeta b{font-family:var(--serif);font-weight:400;font-size:23px;line-height:1.15}
.tarjeta .precio{margin-left:auto;font-family:var(--serif);font-size:21px;white-space:nowrap}
.tarjeta p{font-size:13.5px;color:var(--suave);margin-top:8px;line-height:1.5}
/* palomita que aparece al elegir */
.sel{position:absolute;top:17px;right:16px;width:24px;height:24px;border-radius:50%;
  border:1.5px solid var(--borde);display:grid;place-items:center;transition:background .3s,border-color .3s}
.sel svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;
  transform:scale(0);transition:transform .45s var(--resorte)}
.tarjeta:has(input:checked){border-color:var(--champagne);
  background:linear-gradient(180deg,rgba(199,167,122,.13),rgba(199,167,122,.03)),var(--blanco);
  box-shadow:0 16px 34px -22px rgba(155,120,70,.7)}
.tarjeta:has(input:checked) .sel{background:var(--espresso);border-color:var(--espresso)}
.tarjeta:has(input:checked) .sel svg{transform:scale(1)}
.tarjeta:has(input:focus-visible){outline:2px solid var(--champagne);outline-offset:2px}
/* paquetes con su metal */
.tarjeta.con-metal .fila{padding-right:0}
.tarjeta.con-metal .sel{display:none}
.tarjeta.con-metal::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--metal);
  transition:width .45s var(--curva);z-index:-1}
.tarjeta.con-metal:has(input:checked)::before{width:100%;opacity:.28}
.plata{--metal:var(--plata)} .oro{--metal:var(--oro)} .diamante{--metal:var(--diamante)}
.medalla{width:30px;height:30px;border-radius:50%;flex:none;background:var(--metal);display:grid;place-items:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -2px 3px rgba(0,0,0,.12),0 0 0 1px rgba(51,43,39,.1)}
.medalla svg{width:11px;height:11px;fill:rgba(51,43,39,.65)}
.tarjeta:has(input:checked) .medalla{animation:gira .8s var(--resorte)}
@keyframes gira{from{transform:rotateY(0) scale(1)}50%{transform:rotateY(180deg) scale(1.15)}to{transform:rotateY(360deg) scale(1)}}
.etiqueta{font-family:var(--sans);font-size:11px;font-weight:600;background:var(--espresso);color:var(--marfil);
  padding:3px 9px;border-radius:99px;white-space:nowrap}
/* eventos con icono */
.tarjeta.con-ico{padding:16px}
.tarjeta.con-ico .fila{flex-direction:column;align-items:flex-start;gap:12px}
.tarjeta.con-ico b{font-size:19px}
.tarjeta .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(199,167,122,.14);
  transition:background .3s,transform .5s var(--resorte)}
.tarjeta .ico svg{width:21px;height:21px;stroke:#9C7A4A;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}
.tarjeta:hover .ico{transform:rotate(-6deg) scale(1.06)}
.tarjeta:has(input:checked) .ico{background:var(--espresso)}
.tarjeta:has(input:checked) .ico svg{stroke:var(--champagne)}
.tarjeta.chica{padding:14px 16px}
.tarjeta.chica b{font-family:var(--sans);font-size:15px;font-weight:500}
.tarjeta.chica .sel{top:13px}

/* ══════════ Pastillas ══════════ */
.pastillas{display:flex;flex-wrap:wrap;gap:8px}
.pastilla{position:relative;cursor:pointer}
.pastilla input{position:absolute;opacity:0;pointer-events:none}
.pastilla span{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:99px;
  background:var(--blanco);border:1px solid var(--borde);font-size:14px;
  transition:background .3s,color .3s,border-color .3s,transform .4s var(--resorte)}
.pastilla:hover span{border-color:var(--champagne)}
.pastilla:active span{transform:scale(.95)}
.pastilla input:checked+span{background:var(--espresso);color:var(--marfil);border-color:var(--espresso);animation:pop .45s var(--resorte)}
.pastilla input:focus-visible+span{outline:2px solid var(--champagne);outline-offset:2px}
@keyframes pop{50%{transform:scale(1.07)}}
.pastilla .gotas{display:inline-flex}
.pastilla .gotas i{width:13px;height:13px;border-radius:50%;margin-left:-4px;box-shadow:0 0 0 1.5px var(--blanco)}
.pastilla .gotas i:first-child{margin-left:0}
.pastilla input:checked+span .gotas i{box-shadow:0 0 0 1.5px var(--espresso)}

/* ══════════ Casillas múltiples ══════════ */
.casillas{display:grid;gap:9px;grid-template-columns:1fr 1fr}
@media (max-width:480px){.casillas{grid-template-columns:1fr}}
.casilla{position:relative;display:flex;gap:12px;align-items:flex-start;background:var(--blanco);
  border:1px solid var(--borde);border-radius:14px;padding:13px 14px;cursor:pointer;
  transition:border-color .3s var(--curva),background .3s,transform .4s var(--resorte)}
.casilla:hover{border-color:var(--champagne)}
.casilla:active{transform:scale(.98)}
.casilla input{position:absolute;opacity:0;pointer-events:none}
.caja-check{width:20px;height:20px;border-radius:6px;border:1.5px solid rgba(51,43,39,.25);flex:none;margin-top:1px;
  display:grid;place-items:center;transition:background .25s,border-color .25s}
.caja-check svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .35s var(--curva) .05s}
.casilla b{font-weight:500;font-size:14.5px;display:block;line-height:1.3}
.casilla small{font-size:12.5px;color:var(--suave);display:block;line-height:1.4;margin-top:2px}
.casilla:has(input:checked){border-color:var(--champagne);background:linear-gradient(180deg,rgba(199,167,122,.12),rgba(199,167,122,.03)),var(--blanco)}
.casilla:has(input:checked) .caja-check{background:var(--espresso);border-color:var(--espresso)}
.casilla:has(input:checked) .caja-check svg{stroke-dashoffset:0}
.casilla:has(input:focus-visible){outline:2px solid var(--champagne);outline-offset:2px}
.contador{font-size:12.5px;color:var(--suave);margin-top:10px}

/* ══════════ Botones ══════════ */
.pies{display:flex;gap:10px;margin-top:34px;padding-top:24px;border-top:1px solid var(--fino);align-items:center}
.bt{position:relative;overflow:hidden;isolation:isolate;height:54px;padding:0 26px;border:0;border-radius:99px;
  font-family:var(--sans);font-weight:500;font-size:15.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  text-decoration:none;transition:background .3s var(--curva),transform .4s var(--resorte),box-shadow .3s}
.bt::before{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);
  transform:translateX(-120%);transition:transform .8s var(--curva)}
.bt:hover::before{transform:translateX(120%)}
.bt:active{transform:scale(.97)}
.bt .flecha{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
  transition:transform .4s var(--resorte)}
.bt:hover .flecha{transform:translateX(4px)}
.bt-ir{background:var(--espresso);color:var(--marfil);flex:1;box-shadow:0 12px 26px -14px rgba(51,43,39,.8)}
.bt-ir:hover{background:#231C18}
.bt-atras{background:transparent;border:1px solid var(--borde);color:var(--espresso);padding:0 20px}
.bt-atras:hover{border-color:var(--champagne)}
.bt-atras .flecha{transform:rotate(180deg)}
.bt-atras:hover .flecha{transform:rotate(180deg) translateX(4px)}
.bt-enviar{background:var(--champagne);color:var(--espresso);flex:1;box-shadow:0 12px 26px -12px rgba(155,120,70,.8)}
.bt-enviar:hover{background:var(--champagne-os)}
.bt:disabled{opacity:.7;cursor:default;transform:none}
.giro{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:giro .8s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
.guardado{font-size:12.5px;color:var(--suave);margin-top:14px;min-height:20px;display:flex;align-items:center;gap:7px;
  opacity:0;transition:opacity .4s}
.guardado.si{opacity:1}
.guardado svg{width:13px;height:13px;stroke:var(--exito);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tecla{font-size:12px;color:var(--suave);margin-left:auto;display:none}
.tecla kbd{font-family:var(--sans);font-size:11px;border:1px solid var(--borde);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--blanco)}
@media (hover:hover) and (min-width:700px){.tecla{display:block}}

/* ══════════ Revisión ══════════ */
.confirma-wa{display:flex;align-items:center;gap:14px;margin-top:24px;padding:16px 18px;border-radius:16px;
  background:linear-gradient(135deg,rgba(31,168,85,.1),rgba(31,168,85,.03)),var(--blanco);border:1px solid rgba(31,168,85,.25)}
.confirma-wa .wa-ico{width:42px;height:42px;border-radius:50%;background:var(--wa);display:grid;place-items:center;flex:none}
.confirma-wa .wa-ico svg{width:22px;height:22px;fill:#fff}
.confirma-wa small{display:block;font-size:12.5px;color:var(--suave)}
.confirma-wa b{font-size:18px;font-weight:600;letter-spacing:.01em}
.confirma-wa .enlace{margin:0 0 0 auto}
.grupo{background:var(--blanco);border:1px solid var(--fino);border-radius:16px;margin-top:12px;overflow:hidden;
  animation:entra .6s var(--curva) both;animation-delay:calc(var(--i,0) * 60ms)}
.grupo-cab{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--fino);
  background:rgba(247,242,234,.5)}
.grupo-cab h2{font-family:var(--serif);font-weight:400;font-size:19px}
.editar{background:none;border:1px solid var(--borde);border-radius:99px;padding:5px 13px;font-size:12.5px;cursor:pointer;
  transition:border-color .2s,background .2s}
.editar:hover{border-color:var(--champagne);background:var(--blanco)}
.r{display:flex;gap:14px;padding:11px 18px;border-bottom:1px solid var(--fino);font-size:14px}
.r:last-child{border-bottom:0}
.r .k{color:var(--suave);flex:0 0 38%}
.r .v{flex:1;font-weight:500;word-break:break-word}

function visibles(){ return PASOS.filter(function(p){ return !p.si || p.si() }) }
function evalua(v){ return typeof v === 'function' ? v() : v }
function camposPlanos(p){
  var out=[];
  (p.campos||[]).forEach(function(c){ if(c.par) c.par.forEach(function(x){out.push(x)}); else out.push(c) });
  return out;
}
function activo(c){ return !c.si || c.si() }

/* ══════════════════ Render de campos ══════════════════ */
var nCampo = 0;
function campo(c){
  if(c.par){
    var hijos = c.par.filter(activo);
    if(!hijos.length) return '';
    if(hijos.length===1) return campo(hijos[0]);
    return '<div class="par campo" style="--i:'+(nCampo++)+'">'+hijos.map(function(h){return campoInterno(h)}).join('')+'</div>';
  }
  if(!activo(c)) return '';
  return '<div class="campo" style="--i:'+(nCampo++)+'">'+campoInterno(c)+'</div>';
}

function campoInterno(c){
  var rot = evalua(c.rot) || '', ayuda = evalua(c.ayuda) || '', ph = evalua(c.ph) || '';
  var id = 'f_'+c.k, val = D[c.k] || '';
  var h = '<div data-campo="'+c.k+'">';
  var etiqueta = rot ? (rot+(c.req?'<span class="req">*</span>':'')) : '';

  if(c.tipo==='tarjetas'){
    if(etiqueta) h += '<div class="rot">'+etiqueta+'</div>';
    h += '<div class="tarjetas'+(c.rejilla?' rejilla':'')+'" role="radiogroup">';
    c.op.forEach(function(o){
      var v=o.v, clase='tarjeta'+(!o.precio&&!o.d&&!c.iconos?' chica':'')+(o.metal?' con-metal '+o.metal:'')+(c.iconos?' con-ico':'');
      h += '<label class="'+clase+'"><input type="radio" name="'+c.k+'" value="'+esc(v)+'"'+(val===v?' checked':'')+'>'+
        '<div class="fila">'+
          (o.metal?'<span class="medalla"><svg><use href="#ch"/></svg></span>':'')+
          (c.iconos?'<span class="ico"><svg viewBox="0 0 24 24">'+(ICO[v]||'')+'</svg></span>':'')+
          '<b>'+esc(v)+'</b>'+
          (o.etiqueta?'<span class="etiqueta">'+o.etiqueta+'</span>':'')+
          (o.precio?'<span class="precio">'+o.precio+'</span>':'')+
        '</div>'+(o.d?'<p>'+o.d+'</p>':'')+
        '<span class="sel"><svg viewBox="0 0 16 16"><use href="#ok"/></svg></span></label>';
    });
    h += '</div>';
  }
  else if(c.tipo==='pastillas'){
    if(etiqueta) h += '<div class="rot">'+etiqueta+'</div>';
    h += '<div class="pastillas" role="radiogroup">';
    c.op.forEach(function(v){
      h += '<label class="pastilla"><input type="radio" name="'+c.k+'" value="'+esc(v)+'"'+(val===v?' checked':'')+'><span>'+esc(v)+'</span></label>';
    });
    h += '</div>';
  }
  else if(c.tipo==='disenos'){
    var cat = DISENOS[CATEGORIA[D.evento]];
    var lista = cat ? cat.p : [];
    h += '<div class="rot">'+etiqueta+'</div><div class="pastillas" role="radiogroup">';
    lista.forEach(function(p){
      h += '<label class="pastilla"><input type="radio" name="'+c.k+'" value="'+esc(p.t)+'"'+(val===p.t?' checked':'')+'>'+
        '<span><i class="gotas"><i style="background:'+p.c[0]+'"></i><i style="background:'+p.c[2]+'"></i><i style="background:'+p.c[1]+'"></i></i>'+esc(p.t)+'</span></label>';
    });
    ['Todavía no sé','Algo diferente'].forEach(function(v){
      h += '<label class="pastilla"><input type="radio" name="'+c.k+'" value="'+v+'"'+(val===v?' checked':'')+'><span>'+v+'</span></label>';
    });
    h += '</div><div class="ayuda">¿No los has visto? <a href="/#ejemplos" target="_blank" rel="noopener">Abre los diseños en otra pestaña</a>.</div>';
  }
  else if(c.tipo==='casillas'){
    var marcadas = (val||'').split(' · ');
    h += '<div class="casillas">';
    c.op.forEach(function(o){
      h += '<label class="casilla"><input type="checkbox" name="'+c.k+'" value="'+esc(o.v)+'"'+(marcadas.indexOf(o.v)>=0?' checked':'')+'>'+
        '<span class="caja-check"><svg viewBox="0 0 16 16"><use href="#ok"/></svg></span>'+
        '<span><b>'+esc(o.v)+'</b>'+(o.d?'<small>'+o.d+'</small>':'')+'</span></label>';
    });
    h += '</div><div class="contador" id="contador"></div>';
  }
  else if(c.tipo==='whatsapp'){
    var ext = !!D.wa_extranjero;
    h += '<label class="rot" for="'+id+'">'+etiqueta+'</label>'+
      '<div class="tel-caja'+(waValido()?' valido':'')+'" id="tel-caja">'+
        (ext?'':'<span class="lada"><svg><use href="#wa"/></svg>+52</span>')+
        '<input id="'+id+'" name="whatsapp" type="tel" inputmode="tel" autocomplete="'+(ext?'tel':'tel-national')+'" '+
        'placeholder="'+(ext?'+1 555 123 4567':'55 1234 5678')+'" value="'+esc(ext?val:formatoMX(localMX(val)))+'">'+
        '<span class="tel-ok"><svg viewBox="0 0 16 16"><use href="#ok"/></svg></span>'+
      '</div>'+
      '<div class="nota-wa"><svg><use href="#wa"/></svg><span>Revisa que sea el número donde tienes WhatsApp. Por ahí te mandamos tu cotización.</span></div>'+
      '<button class="enlace" type="button" data-accion="extranjero">'+(ext?'Mi número es de México':'Mi número no es de México')+'</button>';
  }
  else {
    h += '<label class="rot" for="'+id+'">'+etiqueta+'</label>';
    if(c.tipo==='larga'){
      h += '<textarea id="'+id+'" name="'+c.k+'" placeholder="'+esc(ph)+'">'+esc(val)+'</textarea>';
    } else {
      var t = {texto:'text',correo:'email',fecha:'date',hora:'time',num:'number'}[c.tipo]||'text';
      h += '<input id="'+id+'" name="'+c.k+'" type="'+t+'"'+(c.tipo==='num'?' inputmode="numeric" min="0"':'')+
           (c.auto?' autocomplete="'+c.auto+'"':'')+(ph?' placeholder="'+esc(ph)+'"':'')+' value="'+esc(val)+'">';
    }
  }
  if(ayuda) h += '<div class="ayuda">'+ayuda+'</div>';
  return h + '</div>';
}

function pintaRevision(){
  var lista = visibles(), h = '';
  h += '<div class="confirma-wa campo"><span class="wa-ico"><svg><use href="#wa"/></svg></span>'+
       '<span><small>Te escribiremos a este WhatsApp</small><b>'+esc(waLegible())+'</b></span>'+
       '<button class="enlace" type="button" data-editar="'+indicePaso('Contacto')+'">Cambiar</button></div>';
  var g = 0;
  lista.forEach(function(pp,n){
    if(pp.revision) return;
    var filas = '';
    camposPlanos(pp).forEach(function(c){
      if(!activo(c)) return;
      var v = D[c.k]; if(!v) return;
      if(c.k==='whatsapp') v = waLegible();
      if(c.tipo==='fecha') v = fechaLarga(v);
      if(c.tipo==='hora') v = horaLegible(v);
      var k = c.rv || String(evalua(c.rot)||c.k).replace(/\s*\(opcional\)/,'');
      filas += '<div class="r"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v).replace(/\n/g,'<br>')+'</div></div>';
    });
    if(!filas) return;
    h += '<section class="grupo" style="--i:'+(g++)+'"><div class="grupo-cab"><h2>'+pp.n+'</h2>'+
         '<button class="editar" type="button" data-editar="'+n+'">Editar</button></div>'+filas+'</section>';
  });
  h += '<div class="aviso"><svg><use href="#ch"/></svg><span>Al enviar, tus respuestas llegan directo a nuestro equipo y en breve te escribimos por WhatsApp para darte tu cotización. Todavía no pagas nada.</span></div>';
  return h;
}
function indicePaso(nombre){
  var l=visibles(); for(var n=0;n<l.length;n++) if(l[n].n===nombre) return n; return 0;
}

function pinta(dir, sinAnimacion){
  var lista = visibles(), tot = lista.length;
  if(i >= tot) i = tot-1;
  var lz = $('lienzo'), h;
  nCampo = 0;
  lz.classList.toggle('sin-anim', !!sinAnimacion);

  if(i < 0){
    h = pintaBienvenida();
    $('paso-n').innerHTML = '<b>'+tot+' pasos</b>';
    $('anillo').style.strokeDashoffset = 81.7;
    $('avance').style.width = '0%';
  } else {
    var p = lista[i];
    $('paso-n').innerHTML = '<b>'+p.n+'</b> · '+(i+1)+' de '+tot;
    var frac = (i+1)/tot;
    $('anillo').style.strokeDashoffset = (81.7*(1-frac)).toFixed(1);
    $('avance').style.width = (frac*100)+'%';
    h = '<h1>'+p.t+'</h1>'+(p.b?'<p class="bajada">'+p.b+'</p>':'');
    if(p.revision) h += pintaRevision();
    else {
      h += '<div class="bloque">';
      p.campos.forEach(function(c){ h += campo(c) });
      h += '</div>';
    }
  }
  var scrollAntes = window.scrollY;
  lz.innerHTML = h;
  contar();

  var p2 = i>=0 ? lista[i] : null;
  $('atras').classList.toggle('oculto', i<0);
  var txt = i<0 ? 'Empezar' : (p2.revision ? 'Enviar mi cuestionario' : (desdeRevision ? 'Guardar y volver a revisar' : 'Continuar'));
  $('ir-txt').textContent = txt;
  $('ir').className = 'bt ' + (p2 && p2.revision ? 'bt-enviar' : 'bt-ir');
  $('tecla').style.visibility = (p2 && p2.revision) ? 'hidden' : '';

  if(sinAnimacion){ window.scrollTo(0, scrollAntes); }
  else {
    window.scrollTo({top:0, behavior: quieto ? 'auto' : 'smooth'});
    if(!quieto && lz.animate && dir){
      lz.animate([{opacity:0, transform:'translateX('+(dir>0?28:-28)+'px)'},{opacity:1, transform:'none'}],
                 {duration:480, easing:'cubic-bezier(.22,.61,.36,1)'});
    }
  }
  vistaPrevia();
  ultimaFirma = firma();
}

/* ══════════════════ Recoger respuestas ══════════════════ */
function recoge(el){
  if(!el || !el.name) return;
  if(el.type==='radio'){ if(el.checked) D[el.name]=el.value }
  else if(el.type==='checkbox'){
    D[el.name] = $$('input[name="'+el.name+'"]:checked', $('lienzo')).map(function(x){return x.value}).join(' · ');
  }
  else if(el.name==='whatsapp'){
    if(D.wa_extranjero){ D.whatsapp = el.value }
    else {
      var d = localMX(el.value), f = formatoMX(d);
      if(el.value !== f) el.value = f;
      D.whatsapp = d ? '+52 '+f : '';
    }
    $('tel-caja').classList.toggle('valido', waValido());
  }
  else D[el.name] = el.value;
  var envoltura = el.closest('[data-campo]');
  if(envoltura && envoltura.classList.contains('falta')){
    envoltura.classList.remove('falta');
    var er = envoltura.querySelector('.error'); if(er) er.remove();
  }
  guardar();
  vistaPrevia();
}

function contar(){
  var c = $('contador'); if(!c) return;
  var n = D.secciones ? D.secciones.split(' · ').filter(Boolean).length : 0;
  c.textContent = n ? (n===1?'1 sección elegida':n+' secciones elegidas') : 'Ninguna elegida todavía';
}

var lz = $('lienzo');
lz.addEventListener('input', function(e){ if(e.target.type!=='radio'&&e.target.type!=='checkbox') recoge(e.target) });
lz.addEventListener('change', function(e){
  var t = e.target;
  if(t.type==='radio'||t.type==='checkbox'){
    recoge(t);
    if(t.type==='checkbox') contar();
    // si esta respuesta cambia qué preguntas se ven, redibujamos sin movernos
    setTimeout(function(){ repinta(t) }, 0);
  }
});
lz.addEventListener('click', function(e){
  var b = e.target.closest('[data-accion="extranjero"]');
  if(b){
    D.wa_extranjero = D.wa_extranjero ? '' : '1';
    D.whatsapp = ''; guardar(); pinta(0,true);
    var inp = $('f_whatsapp'); if(inp) inp.focus();
    return;
  }
  var ed = e.target.closest('[data-editar]');
  if(ed){ desdeRevision = true; i = +ed.getAttribute('data-editar'); pinta(-1) }
});
document.addEventListener('keydown', function(e){
  if(e.key!=='Enter' || e.isComposing || e.shiftKey) return;
  var t = e.target, tag = t.tagName;
  if(tag==='TEXTAREA' || tag==='BUTTON' || tag==='A' || !$('ir')) return;
  var p = visibles()[i];
  if(p && p.revision) return;   // enviar siempre es con clic
  e.preventDefault(); $('ir').click();
});

/* firma de lo que se ve, para saber si hay que redibujar */
var ultimaFirma = '';
function firma(){
  if(i<0) return '';
  var p = visibles()[i]; if(!p) return '';
  return visibles().length+'|'+camposPlanos(p).filter(activo).map(function(c){return c.k}).join(',');
}
function repinta(t){
  if(firma()===ultimaFirma) return;
  var nombre = t.name, valor = t.value;
  pinta(0,true);
  var nuevo = $('lienzo').querySelector('input[name="'+nombre+'"][value="'+valor.replace(/"/g,'\\"')+'"]');
  if(nuevo) nuevo.focus({preventScroll:true});
}

/* ══════════════════ Validación ══════════════════ */
function valida(){
  var p = visibles()[i]; if(!p || p.revision) return true;
  var primero = null;
  camposPlanos(p).forEach(function(c){
    if(!activo(c)) return;
    var mal = null;
    if(c.k==='whatsapp'){
      if(!D.whatsapp) mal = 'Necesitamos tu WhatsApp para contactarte.';
      else if(!waValido()) mal = D.wa_extranjero ? 'Escribe el número completo con clave de país.' : 'Deben ser 10 dígitos, por ejemplo 55 1234 5678.';
    }
    else if(c.req && !D[c.k]) mal = 'Falta este dato.';
    else if(c.tipo==='correo' && D[c.k] && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(D[c.k])) mal = 'Revisa tu correo, parece incompleto.';
    var env = $('lienzo').querySelector('[data-campo="'+c.k+'"]');
    if(!env) return;
    var er = env.querySelector('.error'); if(er) er.remove();
    env.classList.remove('falta');
    if(mal){
      env.classList.add('falta');
      env.insertAdjacentHTML('beforeend','<div class="error">'+mal+'</div>');
      env.classList.remove('sacude'); void env.offsetWidth; env.classList.add('sacude');
      if(!primero) primero = env;
    }
  });
  if(primero){
    primero.scrollIntoView({behavior: quieto?'auto':'smooth', block:'center'});
    var f = primero.querySelector('input:not([type=radio]):not([type=checkbox]),textarea');
    if(f) setTimeout(function(){ try{ f.focus({preventScroll:true}) }catch(e){} }, 350);
    return false;
  }
  return true;
}

/* ══════════════════ Navegación ══════════════════ */
$('ir').addEventListener('click', function(){
  var lista = visibles(), p = lista[i];
  if(p && p.revision){ enviar(); return }
  if(i>=0 && !valida()) return;
  if(desdeRevision){ desdeRevision=false; i = visibles().length-1 }
  else if(i < lista.length-1) i++;
  pinta(1);
});
$('atras').addEventListener('click', function(){
  if(i>=0){ i--; desdeRevision=false; pinta(-1) }
});

/* ══════════════════ Vista previa ══════════════════ */
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function fechaLarga(f){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(f||''); if(!m) return f;
  return (+m[3])+' de '+MESES[+m[2]-1]+' de '+m[1];
}
function horaLegible(h){
  var m = /^(\d{2}):(\d{2})/.exec(h||''); if(!m) return h;
  var hh = +m[1], ap = hh>=12?'PM':'AM'; hh = hh%12||12;
  return hh+':'+m[2]+' '+ap;
}
function fechaCorta(f){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(f||''); if(!m) return 'DD · MM · AA';
  return m[3]+' · '+m[2]+' · '+m[1].slice(2);
}
var ultimoTema = '';
function vistaPrevia(){
  var pv = $('pv'); if(!pv || getComputedStyle(pv.closest('.vista')).display==='none') return;
  var cat = DISENOS[CATEGORIA[D.evento]];
  var diseno = null;
  if(cat) cat.p.forEach(function(p){ if(p.t===D.plantilla) diseno = p });
  if(!diseno && cat) diseno = cat.p[0];
  var c = diseno ? diseno.c : ['#332B27','#F7F2EA','#C7A77A'];
  var tema = c.join();
  pv.style.setProperty('--m-fondo', c[0]); pv.style.setProperty('--m-tinta', c[1]); pv.style.setProperty('--m-acento', c[2]);
  pv.className = 'pantalla '+(diseno&&diseno.k||'');
  if(tema!==ultimoTema && ultimoTema && !quieto){ pv.classList.remove('brilla'); void pv.offsetWidth; pv.classList.add('brilla') }
  ultimoTema = tema;
  $('pv-rotulo').textContent = cat ? cat.r : (D.evento==='Otro' ? 'Te esperamos' : 'Tu evento');
  $('pv-nombre').textContent = D.nombres || (esBoda() ? 'Sus nombres' : 'Tu nombre aquí');
  $('pv-fecha').textContent = fechaCorta(D.fecha);
  $('pv-lugar').textContent = D.sede2_nombre || D.ciudad || '';
  var metal = METAL[D.paquete];
  $('pv-pie').innerHTML = metal ? '<span class="medalla '+metal+'"><svg><use href="#ch"/></svg></span><span>Paquete <b>'+D.paquete+'</b></span>' : '';
}
window.addEventListener('resize', vistaPrevia);

/* ══════════════════ Envío ══════════════════ */
function folio(){
  var L="ABCDEFGHJKLMNPQRSTUVWXYZ23456789", s="";
  for(var n=0;n<5;n++) s+=L.charAt(Math.floor(Math.random()*L.length));
  return s;
}
function enviar(){
  var b = $('ir'); b.disabled = true;
  $('ir-txt').textContent = 'Enviando';
  b.querySelector('.flecha').outerHTML = '<span class="giro"></span>';
  D.folio = folio();
  D.enviado = new Date().toISOString();
  D.origen = location.href;
  D.whatsapp = waLegible();
  var datos = {}; Object.keys(D).forEach(function(k){ if(k!=='wa_extranjero') datos[k]=D[k] });

  if(ENDPOINT){
    var hecho = false, listo = function(){ if(!hecho){ hecho=true; final() } };
    fetch(ENDPOINT, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(datos)}).then(listo)['catch'](listo);
    setTimeout(listo, 8000);
  } else {
    // Sin endpoint configurado, el resumen se va por WhatsApp para no perder nada
    var res = Object.keys(datos).filter(function(k){return datos[k]}).map(function(k){ return k+': '+datos[k] }).join('\n');
    window.open('https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent('CUESTIONARIO SAVEY\n\n'+res),'_blank');
    final();
  }
}

function final(){
  try{ localStorage.removeItem('savey-brief') }catch(e){}
  var nombre = (D.contacto||'').trim().split(/\s+/)[0];
  $('controles').remove();
  $('cab-paso').innerHTML = '<b>Enviado</b>';
  $('avance').style.width = '100%';
  var ok = '<svg viewBox="0 0 16 16"><use href="#ok"/></svg>';
  $('lienzo').innerHTML =
    '<div class="fin">'+
      '<div class="sello" id="sello"><span class="circulo"></span><svg class="palomita" viewBox="0 0 40 40"><path d="M10 21l7 7 14-16"/></svg></div>'+
      '<h1>¡Listo'+(nombre?', '+esc(nombre):'')+'!</h1>'+
      '<p class="bajada">Recibimos tu cuestionario. En breve alguien del equipo de Savey te escribirá por WhatsApp para darte tu cotización y empezar a diseñar tu invitación contigo.</p>'+
      '<div class="fin-wa"><span><svg><use href="#wa"/></svg></span>'+esc(D.whatsapp)+'</div>'+
      '<ol class="linea-tiempo">'+
        '<li class="hecho" style="--i:0"><span class="punto">'+ok+'</span><span><b>Cuestionario recibido</b><small>Ya tenemos todos tus datos.</small></span></li>'+
        '<li class="ahora" style="--i:1"><span class="punto"></span><span><b>Te escribimos por WhatsApp</b><small>Revisamos tu evento y te mandamos la cotización.</small></span></li>'+
        '<li style="--i:2"><span class="punto"><svg viewBox="0 0 24 24" style="fill:var(--champagne);stroke:none"><use href="#ch"/></svg></span><span><b>Diseñamos tu invitación</b><small>Te mandamos tu liga para que la revises.</small></span></li>'+
      '</ol>'+
      '<div class="folio">Tu folio <b>'+esc(D.folio)+'</b></div>'+
      '<p class="fin-nota">¿Prefieres escribirnos tú? Estamos en el <b>+52 1 56 1890 6790</b>.</p>'+
      '<div class="acciones">'+
        '<a class="bt bt-wa" href="https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent('Hola Savey, acabo de llenar el cuestionario. Mi folio es '+D.folio+'.')+'" target="_blank" rel="noopener"><svg><use href="#wa"/></svg>Escribirle a Savey</a>'+
        '<a class="bt bt-ir" href="/">Volver a Savey</a>'+
      '</div>'+
    '</div>';
  window.scrollTo({top:0, behavior: quieto?'auto':'smooth'});
  vistaPrevia();
  if(!quieto) chispas();
}

function chispas(){
  var s = $('sello'); if(!s || !s.animate) return;
  for(var n=0;n<14;n++){
    var el = document.createElementNS('http://www.w3.org/2000/svg','svg');
    el.setAttribute('class','chispa-vuela');
    el.innerHTML = '<use href="#ch"/>';
    s.appendChild(el);
    var ang = (n/14)*Math.PI*2 + Math.random()*.4, dist = 70+Math.random()*60, tam = .5+Math.random()*.8;
    el.animate([
      {transform:'translate(-50%,-50%) scale(0) rotate(0deg)', opacity:1},
      {transform:'translate(calc(-50% + '+(Math.cos(ang)*dist).toFixed(0)+'px), calc(-50% + '+(Math.sin(ang)*dist).toFixed(0)+'px)) scale('+tam.toFixed(2)+') rotate(180deg)', opacity:0}
    ], {duration:1100+Math.random()*500, delay:350, easing:'cubic-bezier(.16,1,.3,1)', fill:'forwards'});
  }
}

recuperar();
pinta(0);
})();
</script>
