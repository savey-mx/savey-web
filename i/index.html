<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.ico?v=3" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<link rel="manifest" href="/site.webmanifest">
<title>Invitación</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="tipos" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --fondo:#1B241B; --papel:#F2EDE1; --acento:#B0873F; --suave:#6E7F62;
  --display:'Instrument Serif',Georgia,serif;
  --texto:'Instrument Sans',system-ui,sans-serif;
  --alinea:center;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--fondo);color:var(--papel);font-family:var(--texto);
  font-size:1.0625rem;line-height:1.7;overflow-x:hidden}
body.sellado{overflow:hidden;height:100vh;height:100svh}
a{color:inherit}
:focus-visible{outline:2px solid var(--acento);outline-offset:4px}
svg{display:block}
img{display:block;max-width:100%}

/* ══════════ Trama ══════════ */
.trama{position:absolute;inset:0;pointer-events:none;opacity:.18;z-index:0}
.trama svg{width:100%;height:100%}

/* ══════════ Hueco de foto ══════════ */
.foto{position:relative;overflow:hidden;background:color-mix(in srgb,var(--acento) 12%,var(--fondo))}
.foto img{width:100%;height:100%;object-fit:cover;display:none}
.foto img.ok{display:block}
.foto .hueco{position:absolute;inset:0;display:grid;place-items:center;gap:.55rem;
  align-content:center;text-align:center;padding:1rem}
.foto img.ok ~ .hueco{display:none}
.hueco::before{content:"";position:absolute;inset:10px;border:1px dashed var(--acento);opacity:.45;border-radius:3px}
.hueco svg{width:30px;height:30px;fill:var(--acento);opacity:.75}
.hueco span{font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--acento);opacity:.85}

/* ══════════ Portada: base ══════════ */
#sobre{position:fixed;inset:0;z-index:100;background:var(--fondo);overflow:hidden;
  -webkit-transition:opacity .9s ease,-webkit-transform .9s ease;
  transition:opacity .9s ease,transform .9s cubic-bezier(.4,0,.2,1)}
#sobre.abierto{opacity:0;pointer-events:none}
#sobre.abierto.sal-zoom{transform:scale(1.08)}
#sobre.abierto.sal-sube{transform:translateY(-7%)}
.lienzo{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:2rem 1.5rem;text-align:center;z-index:2}
.bloque{display:flex;flex-direction:column;align-items:center;gap:1.1rem;max-width:24rem;width:100%}
.p-tipo{font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;color:var(--acento)}
.p-nombre{font-family:var(--display);font-weight:400;font-size:clamp(2.5rem,13vw,4rem);
  line-height:1;letter-spacing:-.01em}
.p-fecha{font-size:.78rem;letter-spacing:.26em;opacity:.72}
.filete{width:52px;height:1px;background:var(--acento);opacity:.6}

/* ── 1. Retrato a sangre ── */
.pc-retrato .foto-portada{position:absolute;inset:0;z-index:0}
.pc-retrato .foto-portada::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top,var(--fondo) 4%,color-mix(in srgb,var(--fondo) 55%,transparent) 42%,transparent 75%)}
.pc-retrato .lienzo{justify-content:flex-end;padding-bottom:3rem}
.pc-retrato .trama{opacity:.08}

/* ── 2. Arco ── */
.pc-arco .arco-foto{width:min(62vw,15rem);aspect-ratio:3/4.2;
  border-radius:999px 999px 8px 8px;overflow:hidden;
  box-shadow:0 22px 55px -22px rgba(0,0,0,.6);margin-bottom:.4rem}
.pc-arco .arco-foto .foto{position:absolute;inset:0}
.pc-arco .arco-foto{position:relative}

/* ── 3. Sobre con solapa ── */
.pc-sobre .lienzo{padding:1.5rem}
.carta-sobre{position:relative;width:min(88vw,22rem);aspect-ratio:1/1.35;perspective:1400px}
.carta-cuerpo{position:absolute;inset:0;background:var(--papel);color:var(--fondo);
  border-radius:4px;box-shadow:0 26px 60px -24px rgba(0,0,0,.6);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9rem;padding:2.2rem 1.4rem}
.pc-sobre .p-tipo{color:var(--suave)}
.pc-sobre .p-fecha{opacity:.6}
.solapa{position:absolute;left:0;right:0;top:0;height:46%;
  background:color-mix(in srgb,var(--acento) 82%,var(--fondo));
  clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top center;transition:transform .9s cubic-bezier(.6,0,.2,1);
  z-index:3;border-radius:4px 4px 0 0}
.pc-sobre.roto .solapa{transform:rotateX(-172deg)}

/* ── 4. Díptico ── */
.pc-diptico .lienzo{padding:0;display:grid;grid-template-rows:1.05fr .95fr;text-align:left}
.pc-diptico .dip-foto{position:relative;overflow:hidden}
.pc-diptico .dip-texto{background:var(--papel);color:var(--fondo);
  display:flex;flex-direction:column;justify-content:center;gap:.85rem;padding:2rem 1.8rem;align-items:flex-start}
.pc-diptico .p-tipo{color:var(--suave)}
.pc-diptico .p-fecha{opacity:.6}
.pc-diptico .bloque{align-items:flex-start;text-align:left}

/* ── 5. Marco de galería ── */
.pc-marco .lienzo::before{content:"";position:absolute;inset:1.1rem;border:1px solid var(--acento);opacity:.55}
.pc-marco .lienzo::after{content:"";position:absolute;inset:1.5rem;border:1px solid var(--acento);opacity:.25}
.pc-marco .marco-foto{width:min(52vw,11rem);aspect-ratio:1;border-radius:2px;overflow:hidden;position:relative;
  box-shadow:0 16px 40px -18px rgba(0,0,0,.55)}

/* ── 6. Tipográfica ── */
.pc-tipografica .p-nombre{font-size:clamp(3.4rem,21vw,7rem);line-height:.88;letter-spacing:-.03em}
.pc-tipografica .p-tipo{opacity:.55;letter-spacing:.4em}
.pc-tipografica .trama{opacity:.24}

/* ── 7. Medallón ── */
.pc-medallon .medallon{width:min(58vw,13rem);aspect-ratio:1;border-radius:50%;overflow:hidden;position:relative;
  box-shadow:0 0 0 1px var(--acento),0 0 0 9px color-mix(in srgb,var(--acento) 22%,transparent),
             0 20px 50px -20px rgba(0,0,0,.6)}

/* ── 8. Franja ── */
.pc-franja .lienzo{padding:0;justify-content:center}
.pc-franja .banda{background:var(--papel);color:var(--fondo);width:100%;
  padding:2.6rem 1.6rem;display:flex;flex-direction:column;align-items:center;gap:.85rem;
  box-shadow:0 0 60px -10px rgba(0,0,0,.45)}
.pc-franja .p-tipo{color:var(--suave)}
.pc-franja .p-fecha{opacity:.6}
.pc-franja .franja-foto{width:100%;flex:1;position:relative;overflow:hidden}

/* ── 9. Cinta lateral ── */
.pc-cinta .lienzo{padding:0;display:grid;grid-template-columns:.34fr 1fr;text-align:left}
.pc-cinta .cinta{position:relative;overflow:hidden;background:color-mix(in srgb,var(--acento) 28%,var(--fondo))}
.pc-cinta .cinta .trama{opacity:.5}
.pc-cinta .cinta-cuerpo{display:flex;flex-direction:column;justify-content:center;
  gap:.9rem;padding:2rem 1.6rem;align-items:flex-start}
.pc-cinta .bloque{align-items:flex-start;text-align:left}

/* ══════════ Botón de apertura ══════════ */
#lacre{border:0;cursor:pointer;display:grid;place-items:center;
  width:92px;height:92px;border-radius:50%;color:var(--fondo);
  background:radial-gradient(circle at 34% 30%,color-mix(in srgb,var(--acento) 55%,#fff),var(--acento) 58%,color-mix(in srgb,var(--acento) 68%,#000));
  box-shadow:0 14px 32px rgba(0,0,0,.4);
  -webkit-animation:latido 3.4s ease-in-out infinite;animation:latido 3.4s ease-in-out infinite}
#lacre svg{width:30px;height:30px;fill:currentColor}
#lacre.plano{width:auto;height:auto;border-radius:100px;background:none;box-shadow:none;animation:none;
  border:1px solid var(--acento);color:var(--acento);padding:.8rem 1.8rem;
  font:500 .72rem/1 var(--texto);letter-spacing:.22em;text-transform:uppercase}
#lacre.solido{width:auto;height:auto;border-radius:3px;background:var(--acento);box-shadow:none;animation:none;
  color:var(--fondo);padding:.85rem 1.9rem;font:500 .72rem/1 var(--texto);
  letter-spacing:.22em;text-transform:uppercase}
.pc-sobre #lacre,.pc-diptico #lacre,.pc-cinta #lacre,.pc-franja #lacre{z-index:5}
@-webkit-keyframes latido{0%,100%{-webkit-transform:scale(1)}50%{-webkit-transform:scale(1.05)}}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.p-toque{font-size:.68rem;letter-spacing:.2em;opacity:.5}

#pase{background:var(--papel);color:var(--fondo);padding:1.1rem;text-align:center;
  max-width:19rem;width:100%;border-radius:3px}
#pase .et{font-size:.6rem;letter-spacing:.26em;color:var(--acento);text-transform:uppercase}
#pase .inv{font-family:var(--display);font-size:1.45rem;line-height:1.15;margin:.3rem 0 .15rem}
#pase .lug{font-size:.8rem;color:var(--suave)}

/* ══════════ Cuerpo ══════════ */
main{max-width:35rem;margin:0 auto;padding:0 1.5rem;position:relative;z-index:1}
section{padding:3.4rem 0;border-bottom:1px solid color-mix(in srgb,var(--acento) 20%,transparent);text-align:var(--alinea)}
section:last-of-type{border-bottom:0}
.rotulo{font-size:.66rem;letter-spacing:.3em;color:var(--acento);text-transform:uppercase;margin-bottom:.8rem}
h2{font-family:var(--display);font-weight:400;font-size:1.8rem;line-height:1.18;margin-bottom:.6rem;letter-spacing:-.01em}
p{opacity:.85;max-width:44ch}
section[style*="center"] p,.al-centro p{margin-left:auto;margin-right:auto}

#heroe{text-align:center;padding-top:3.4rem}
#emblema{width:40px;height:40px;fill:var(--acento);margin:0 auto 1.4rem}
.cita{font-family:var(--display);font-style:italic;font-size:1.3rem;line-height:1.5;max-width:25ch;margin:0 auto}
#cuenta{display:flex;justify-content:center;gap:1.3rem;margin-top:2rem}
#cuenta b{display:block;font-family:var(--display);font-weight:400;font-size:2.2rem;line-height:1;
  color:var(--acento);font-variant-numeric:tabular-nums}
#cuenta span{font-size:.6rem;letter-spacing:.18em;opacity:.6}

.linea{list-style:none;border-left:1px solid color-mix(in srgb,var(--acento) 38%,transparent);
  padding-left:1.25rem;text-align:left;display:inline-block}
.linea li{position:relative;padding-bottom:1.3rem}
.linea li:last-child{padding-bottom:0}
.linea li::before{content:"";position:absolute;left:-1.63rem;top:.5rem;width:7px;height:7px;border-radius:50%;background:var(--acento)}
.linea .h{font-size:.72rem;letter-spacing:.14em;color:var(--acento)}
.linea .e{font-family:var(--display);font-size:1.18rem}

.lugar{margin-bottom:2.2rem}
.lugar:last-child{margin-bottom:0}
.lugar .nom{font-family:var(--display);font-size:1.35rem;margin:.1rem 0}
.lugar .dir{font-size:.88rem;opacity:.68;margin-bottom:.8rem}
.enlace{display:inline-block;padding:.55rem 1.3rem;border:1px solid var(--acento);color:var(--acento);
  font-size:.68rem;letter-spacing:.18em;text-decoration:none;text-transform:uppercase;border-radius:3px;
  transition:background .25s,color .25s}
.enlace:hover{background:var(--acento);color:var(--fondo)}

.rejilla-fotos{display:grid;gap:.5rem;grid-template-columns:repeat(3,1fr);margin-top:1.4rem}
.rejilla-fotos .foto{aspect-ratio:1;border-radius:3px}
.rejilla-fotos .foto:first-child{grid-column:span 2;grid-row:span 2;aspect-ratio:1}
.rejilla-fotos .hueco span{font-size:.55rem;letter-spacing:.16em}
.rejilla-fotos .hueco svg{width:20px;height:20px}

.padrinos{display:grid;gap:1.1rem;grid-template-columns:repeat(2,1fr);margin-top:1.2rem;text-align:left}
.padrinos .rol{font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--acento)}
.padrinos .qui{font-family:var(--display);font-size:1.08rem;line-height:1.25}

.notas{display:grid;gap:1rem;margin-top:1.2rem;text-align:left}
.nota{border-left:2px solid color-mix(in srgb,var(--acento) 50%,transparent);padding-left:.9rem}
.nota b{display:block;font-weight:500;font-size:.95rem}
.nota span{font-size:.88rem;opacity:.72}

form{display:grid;gap:.95rem;margin-top:1.5rem;text-align:left}
label{font-size:.66rem;letter-spacing:.16em;color:var(--acento);display:block;margin-bottom:.3rem;text-transform:uppercase}
input,select,textarea{width:100%;padding:.78rem .85rem;background:rgba(255,255,255,.05);
  border:1px solid color-mix(in srgb,var(--acento) 38%,transparent);color:var(--papel);
  font-family:inherit;font-size:1rem;border-radius:3px;-webkit-appearance:none;appearance:none}
select option{background:var(--fondo);color:var(--papel)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acento)}
button.enviar{padding:.9rem;border:0;background:var(--acento);color:var(--fondo);font-family:inherit;
  font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;border-radius:3px}
#gracias{display:none;text-align:center;padding:1.8rem 0}
#gracias svg{width:32px;height:32px;fill:var(--acento);margin:0 auto .9rem}

.banco{margin-top:1rem;padding:.95rem;border:1px dashed color-mix(in srgb,var(--acento) 42%,transparent);
  font-size:.94rem;border-radius:3px}
.banco button{margin-top:.55rem;background:none;border:0;color:var(--acento);font-family:inherit;
  font-size:.66rem;letter-spacing:.18em;cursor:pointer;display:none;text-transform:uppercase}

#musica{position:fixed;right:1rem;bottom:1rem;z-index:60;width:42px;height:42px;border-radius:50%;
  background:color-mix(in srgb,var(--fondo) 86%,#fff);border:1px solid color-mix(in srgb,var(--acento) 48%,transparent);
  color:var(--acento);cursor:pointer;display:none;place-items:center}
#musica.visible{display:grid}

footer{text-align:center;padding:2.4rem 1rem 3.2rem;font-size:.66rem;letter-spacing:.14em;opacity:.42;position:relative;z-index:1}
footer a{text-decoration:none}

.oculta{opacity:0;-webkit-transform:translateY(18px);transform:translateY(18px);
  -webkit-transition:opacity .8s ease,-webkit-transform .8s ease;transition:opacity .8s ease,transform .8s ease}
.oculta.visto{opacity:1;-webkit-transform:none;transform:none}

/* entradas de portada */
@media (prefers-reduced-motion:no-preference){
  .ent-fundido .bloque>*{animation:brotar .9s both}
  .ent-fundido .bloque>*:nth-child(2){animation-delay:.12s}
  .ent-fundido .bloque>*:nth-child(3){animation-delay:.24s}
  .ent-fundido .bloque>*:nth-child(4){animation-delay:.36s}
  .ent-sube .bloque>*{animation:subir 1s both}
  .ent-sube .bloque>*:nth-child(2){animation-delay:.14s}
  .ent-sube .bloque>*:nth-child(3){animation-delay:.28s}
  .ent-sube .bloque>*:nth-child(4){animation-delay:.42s}
  .ent-zoom .foto-portada,.ent-zoom .arco-foto,.ent-zoom .medallon,.ent-zoom .marco-foto,.ent-zoom .dip-foto{animation:acercar 1.8s both}
  .ent-escala .p-nombre{animation:escalar 1.1s cubic-bezier(.2,.7,.3,1) both}
  @keyframes brotar{from{opacity:0}to{opacity:1}}
  @keyframes subir{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  @keyframes acercar{from{transform:scale(1.14)}to{transform:scale(1)}}
  @keyframes escalar{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
}
@media (prefers-reduced-motion:reduce){
  .oculta{opacity:1;transform:none;transition:none}
  #lacre{animation:none}
  .solapa{transition:none}
}
@media (min-width:40rem){
  .pc-diptico .lienzo{grid-template-rows:none;grid-template-columns:1fr 1fr}
  .pc-franja .banda{padding:3rem 3rem}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="ic-chispa" viewBox="0 0 24 24"><path d="M12 0c0 6.2 5.8 12 12 12-6.2 0-12 5.8-12 12 0-6.2-5.8-12-12-12C6.2 12 12 6.2 12 0z"/></symbol>

  <symbol id="ic-corona" viewBox="0 0 24 24"><path d="M2 8l4 4 6-8 6 8 4-4v10H2V8zm2 12h16v2H4z"/></symbol>

  <symbol id="ic-sol" viewBox="0 0 24 24"><path d="M12 6a6 6 0 106 6 6 6 0 00-6-6zm0-6h1v4h-1zm0 20h1v4h-1zM0 11h4v1H0zm20 0h4v1h-4zM3 3l3 3-1 1-3-3zm15 15l3 3-1 1-3-3zM21 3l-3 3 1 1 3-3zM6 18l-3 3 1 1 3-3z"/></symbol>
  <symbol id="ic-foto" viewBox="0 0 24 24"><path d="M3 5h4l1.5-2h7L17 5h4v15H3V5zm9 3a5 5 0 105 5 5 5 0 00-5-5zm0 2a3 3 0 11-3 3 3 3 0 013-3z"/></symbol>
</svg>

<div id="sobre" hidden>
  <div class="trama" id="trama-portada"></div>
  <div class="lienzo" id="lienzo"></div>
</div>

<div class="trama" id="trama-cuerpo" style="position:fixed;opacity:.06"></div>

<main id="cuerpo">
  <section id="heroe" class="al-centro">
    <svg id="emblema"><use href="#ic-chispa"/></svg>
    <p class="cita" id="frase"></p>
    <div id="cuenta">
      <div><b id="cd-d">00</b><span>DÍAS</span></div>
      <div><b id="cd-h">00</b><span>HRS</span></div>
      <div><b id="cd-m">00</b><span>MIN</span></div>
      <div><b id="cd-s">00</b><span>SEG</span></div>
    </div>
  </section>

  <section id="sec-cuando">
    <div class="rotulo">¿Cuándo?</div>
    <h2 id="fecha-larga"></h2>
    <ul class="linea" id="itinerario"></ul>
  </section>

  <section id="sec-donde">
    <div class="rotulo">¿Dónde?</div>
    <div id="lugares"></div>
  </section>

  <section id="sec-galeria">
    <div class="rotulo">Galería</div>
    <h2 id="galeria-titulo">Nuestras fotos</h2>
    <div class="rejilla-fotos" id="rejilla-fotos"></div>
  </section>

  <section id="sec-padrinos">
    <div class="rotulo">Padrinos</div>
    <h2>¿Quiénes nos acompañan?</h2>
    <div class="padrinos" id="padrinos"></div>
  </section>

  <section id="sec-dress">
    <div class="rotulo">Código de vestimenta</div>
    <h2 id="dress"></h2>
    <p id="dress-nota"></p>
  </section>

  <section id="sec-notas">
    <div class="rotulo">Buena información</div>
    <div class="notas" id="notas"></div>
  </section>

  <section id="sec-regalos">
    <div class="rotulo">Regalos</div>
    <p id="regalos-texto"></p>
    <div class="banco" id="caja-banco">
      <div id="banco"></div>
      <div id="titular" style="font-size:.8rem;opacity:.65"></div>
      <button id="copiar">Copiar cuenta</button>
    </div>
  </section>

  <section id="sec-rsvp">
    <div class="rotulo">Confirmación</div>
    <h2 id="rsvp-titulo">¿Nos acompañas?</h2>
    <p id="limite"></p>
    <form id="form">

<script>
(function(){

var par=new URLSearchParams(location.search);
var slug=par.get('e')||'', codigo=(par.get('c')||'').toUpperCase();

   botanico:'<pattern id="t" width="74" height="74" patternUnits="userSpaceOnUse"><g '+o+'><path d="M37 10c0 13-8 22-15 26"/><path d="M37 15c-5 1-8 5-9 9"/><path d="M35 24c-5 1-8 5-9 9"/><path d="M33 33c-5 1-8 5-9 9"/><path d="M10 56c11-3 20-1 27 6"/><path d="M17 56c1 3 4 6 7 7"/><path d="M26 58c1 3 4 6 7 7"/></g></pattern>',

   ondas:'<pattern id="t" width="84" height="34" patternUnits="userSpaceOnUse"><g '+o+'><path d="M0 17q21-14 42 0t42 0"/><path d="M0 30q21-14 42 0t42 0"/></g></pattern>',

   lino:'<pattern id="t" width="10" height="10" patternUnits="userSpaceOnUse"><g '+o+' stroke-width=".55"><path d="M0 5h10M5 0v10"/></g></pattern>',
   arcos:'<pattern id="t" width="64" height="64" patternUnits="userSpaceOnUse"><g '+o+'><path d="M0 64a32 32 0 0164 0"/><path d="M13 64a19 19 0 0138 0"/></g></pattern>',
   circuito:'<pattern id="t" width="56" height="56" patternUnits="userSpaceOnUse"><g '+o+'><path d="M0 14h20l8 8v20"/><path d="M56 42H36l-8-8V14"/><circle cx="28" cy="42" r="3"/><circle cx="28" cy="14" r="3"/></g></pattern>'
  }[tipo];
  return d?('<svg xmlns="http://www.w3.org/2000/svg"><defs>'+d+'</defs><rect width="100%" height="100%" fill="url(#t)"/></svg>'):'';
}

/* portada, trama, fuente, emblema, alineación, botón, entrada, salida */
function P(a,b,c,d,e,f,g,h){return {portada:a,patron:b,fuente:c,emblema:d,alinea:e||'center',boton:f||'lacre',entrada:g||'fundido',salida:h||'zoom'}}
var PLANTILLAS={
 aurora:     P('arco','botanico','clasica','ic-hoja','center','lacre','zoom','zoom'),
 sal:        P('retrato','ondas','geometrica','ic-sol','center','plano','sube','sube'),
 bruma:      P('diptico','lino','moderna','ic-anillos','left','plano','sube','sube'),
 granate:    P('marco','damasco','titulo','ic-copa','center','lacre','fundido','zoom'),
 almendro:   P('medallon','botanico','suave','ic-hoja','center','plano','zoom','zoom'),

 encanto:    P('sobre','botanico','clasica','ic-corona','center','lacre','fundido','zoom'),
 aura:       P('arco','estrellas','suave','ic-chispa','center','lacre','zoom','zoom'),
 medianoche: P('tipografica','rayas','moderna','ic-corona','center','plano','escala','sube'),
 jacaranda:  P('marco','damasco','titulo','ic-chispa','center','lacre','fundido','zoom'),
 marfil:     P('retrato','lino','serif','ic-chispa','center','solido','zoom','zoom'),

 cielo:      P('arco','arcos','clasica','ic-paloma','center','lacre','zoom','zoom'),
 nube:       P('medallon','lino','geometrica','ic-paloma','center','plano','fundido','zoom'),
 oliva:      P('cinta','botanico','suave','ic-hoja','left','plano','sube','sube'),
 azahar:     P('sobre','damasco','titulo','ic-paloma','center','lacre','fundido','zoom'),
 trigo:      P('franja','escamas','clasica','ic-sol','center','plano','sube','sube'),

 confeti:    P('franja','confeti','redonda','ic-globo','center','solido','sube','sube'),
 safari:     P('retrato','botanico','redonda','ic-hoja','center','solido','zoom','zoom'),
 oceano:     P('diptico','escamas','redonda','ic-globo','left','solido','sube','sube'),
 globos:     P('tipografica','confeti','redonda','ic-globo','center','solido','escala','zoom'),
 jardin:     P('medallon','botanico','redonda','ic-hoja','center','solido','zoom','zoom'),

 neon:       P('tipografica','circuito','condensada','ic-nota','left','plano','escala','sube'),
 cassette:   P('cinta','geometrico','condensada','ic-nota','left','solido','sube','sube'),
 polaroid:   P('marco','lino','sans','ic-chispa','center','plano','fundido','zoom'),
 prisma:     P('diptico','circuito','geometrica','ic-chispa','left','solido','sube','sube'),
 vinilo:     P('retrato','terrazo','condensada','ic-nota','left','solido','zoom','sube'),

 consejo:    P('franja','deco','titulo','ic-copa','left','plano','sube','sube'),
 cumbre:     P('cinta','cuadros','geometrica','ic-chispa','left','plano','sube','sube'),
 brindis:    P('marco','deco','titulo','ic-copa','center','lacre','fundido','zoom'),
 enlace:     P('diptico','cuadros','geometrica','ic-chispa','left','solido','sube','sube'),
 distincion: P('tipografica','deco','moderna','ic-copa','center','plano','escala','zoom')
};

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function cajaFoto(src,etiqueta,clase){
  return '<div class="foto '+(clase||'')+'">'+
    (src?'<img src="'+esc(src)+'" alt="" onload="this.classList.add(\'ok\')" onerror="this.remove()">':'')+
    '<div class="hueco"><svg><use href="#ic-foto"/></svg><span>'+(etiqueta||'Tu foto aquí')+'</span></div></div>';
}

function botonHTML(pl,E){
  if(pl.boton==='lacre') return '<button id="lacre" aria-label="Abrir invitación"><svg><use href="#'+pl.emblema+'"/></svg></button><div class="p-toque">Toca el sello</div>';
  var cl=pl.boton==='solido'?'solido':'plano';
  return '<button id="lacre" class="'+cl+'">'+(E.textoBoton||'Abrir invitación')+'</button>';
}

function bloqueTexto(E,conFilete){
  return '<div class="p-tipo">'+esc(E.tipo)+'</div>'+
    (conFilete?'<div class="filete"></div>':'')+
    '<h1 class="p-nombre">'+esc(E.nombre)+'</h1>'+
    '<div class="p-fecha">'+esc(E.fechaCorta||'')+'</div>';
}

function paseHTML(pase){
  if(!pase) return '';
  return '<div id="pase"><div class="et">Pase personalizado</div><div class="inv">'+esc(pase.nombre)+
    '</div><div class="lug">'+(pase.lugares===1?'1 lugar reservado':pase.lugares+' lugares reservados')+'</div></div>';
}

function armarPortada(pl,E,pase){
  var t=bloqueTexto(E,true), b=botonHTML(pl,E), p=paseHTML(pase);
  var f=E.fotoPortada||'';
  switch(pl.portada){
    case 'retrato':
      return '<div class="foto-portada">'+cajaFoto(f,'Tu foto de portada')+'</div>'+
        '<div class="bloque">'+t+p+b+'</div>';
    case 'arco':
      return '<div class="bloque"><div class="arco-foto">'+cajaFoto(f,'Tu foto')+'</div>'+t+p+b+'</div>';
    case 'medallon':
      return '<div class="bloque"><div class="medallon">'+cajaFoto(f,'Tu foto')+'</div>'+t+p+b+'</div>';
    case 'marco':
      return '<div class="bloque"><div class="marco-foto">'+cajaFoto(f,'Tu foto')+'</div>'+t+p+b+'</div>';
    case 'sobre':
      return '<div class="carta-sobre"><div class="carta-cuerpo"><div class="bloque">'+t+p+'</div></div>'+
        '<div class="solapa"></div></div>'+b;
    case 'diptico':
      return '<div class="dip-foto">'+cajaFoto(f,'Tu foto')+'</div>'+
        '<div class="dip-texto"><div class="bloque">'+t+p+b+'</div></div>';
    case 'franja':
      return '<div class="franja-foto">'+cajaFoto(f,'Tu foto')+'</div>'+
        '<div class="banda"><div class="bloque">'+t+p+b+'</div></div>'+
        '<div class="franja-foto">'+cajaFoto('','')+'</div>';
    case 'cinta':
      return '<div class="cinta"><div class="trama"></div></div>'+
        '<div class="cinta-cuerpo"><div class="bloque">'+t+p+b+'</div></div>';
    default:
      return '<div class="bloque">'+t+p+b+'</div>';
  }
}

function pintar(E){
  var pl=PLANTILLAS[E.plantilla]||PLANTILLAS.aurora;
  var col=E.colores||{}, r=document.documentElement.style;
  r.setProperty('--fondo',col.fondo||'#1B241B');
  r.setProperty('--papel',col.papel||'#F2EDE1');
  r.setProperty('--acento',col.acento||'#B0873F');
  r.setProperty('--suave',col.suave||col.acento||'#6E7F62');
  r.setProperty('--alinea',pl.alinea);

  var f=FUENTES[pl.fuente]||FUENTES.serif, lk=$('tipos');
  if(lk) lk.href='https://fonts.googleapis.com/css2?family='+f.css+'&family=Instrument+Sans:wght@400;500&display=swap';
  r.setProperty('--display',f.fam);
  if(pl.fuente==='sans'||pl.fuente==='geometrica'||pl.fuente==='redonda'||pl.fuente==='condensada') r.setProperty('--texto',f.fam);

  var svgT=trama(pl.patron,col.acento||'#B0873F');
  $('trama-portada').innerHTML=svgT;
  $('trama-cuerpo').innerHTML=svgT;

  var pase=(E.pases&&E.pases[codigo])?E.pases[codigo]:null;
  var maxL=pase?pase.lugares:6;

  var sobre=$('sobre');
  sobre.className='pc-'+pl.portada+' ent-'+pl.entrada;
  $('lienzo').innerHTML=armarPortada(pl,E,pase);
  var cintaT=document.querySelector('.cinta .trama'); if(cintaT) cintaT.innerHTML=svgT;
  if(pase) { var fn=$('f-nombre'); if(fn) fn.value=pase.nombre; }

  document.title=E.tipo+' · '+E.nombre;
  sobre.hidden=false;
  document.body.classList.add('sellado');

  $('emblema').innerHTML='<use href="#'+pl.emblema+'"/>';
  $('frase').textContent=E.frase||'';
  $('fecha-larga').textContent=E.fechaTexto||'';
  $('dress').textContent=E.dressCode||'';
  $('dress-nota').textContent=E.dressNota||'';
  $('limite').textContent=E.limiteRsvp?'Te agradecemos confirmar antes del '+E.limiteRsvp+'.':'';
  $('pie').textContent=E.marca||'Hecho por Savey';
  if(E.rsvpTitulo) $('rsvp-titulo').textContent=E.rsvpTitulo;
  if(E.galeriaTitulo) $('galeria-titulo').textContent=E.galeriaTitulo;

  $('itinerario').innerHTML=(E.itinerario||[]).map(function(i){
    return '<li><div class="h">'+esc(i.hora)+'</div><div class="e">'+esc(i.evento)+'</div></li>'}).join('');

  var sedes=[];
  if(E.ceremonia&&E.ceremonia.lugar) sedes.push(E.ceremonia);
  if(E.recepcion&&E.recepcion.lugar) sedes.push(E.recepcion);
  $('lugares').innerHTML=sedes.map(function(l){
    return '<div class="lugar"><div class="rotulo">'+esc(l.titulo)+' · '+esc(l.hora)+'</div>'+
      '<div class="nom">'+esc(l.lugar)+'</div><div class="dir">'+esc(l.direccion)+'</div>'+
      '<a class="enlace" href="'+esc(l.mapa)+'" target="_blank" rel="noopener">Cómo llegar</a></div>'}).join('');

  if(E.galeria&&E.galeria>0){
    var g='';
    for(var i=0;i<E.galeria;i++) g+=cajaFoto((E.fotos&&E.fotos[i])||'','Foto '+(i+1));
    $('rejilla-fotos').innerHTML=g;
  } else { $('sec-galeria').style.display='none' }

  if(E.padrinos&&E.padrinos.length){
    $('padrinos').innerHTML=E.padrinos.map(function(p){
      return '<div><div class="rol">'+esc(p.rol)+'</div><div class="qui">'+esc(p.nombre)+'</div></div>'}).join('');
  } else { $('sec-padrinos').style.display='none' }

  if(E.notas&&E.notas.length){
    $('notas').innerHTML=E.notas.map(function(n){
      return '<div class="nota"><b>'+esc(n.titulo)+'</b><span>'+esc(n.texto)+'</span></div>'}).join('');
  } else { $('sec-notas').style.display='none' }

  if(E.regalos&&E.regalos.texto){
    $('regalos-texto').textContent=E.regalos.texto;
    $('banco').textContent=E.regalos.banco||'';
    $('titular').textContent=E.regalos.titular||'';
    if(!E.regalos.banco) $('caja-banco').style.display='none';
  } else { $('sec-regalos').style.display='none' }
  if(!E.dressCode) $('sec-dress').style.display='none';
  if(pl.alinea==='center'){ ['sec-cuando','sec-donde','sec-dress','sec-regalos','sec-rsvp','sec-galeria','sec-padrinos','sec-notas']
    .forEach(function(id){var s=$(id); if(s) s.classList.add('al-centro')}) }

  var sel=$('f-lugares');
  for(var j=1;j<=maxL;j++) sel.appendChild(new Option(String(j),String(j)));
  sel.value=String(maxL);
  $('f-asiste').addEventListener('change',function(e){
    $('wrap-lugares').style.display=e.target.value==='si'?'':'none'});

  var meta=new Date(E.fecha).getTime();
  if(!isNaN(meta)){
    var pad=function(n){n=String(Math.max(0,n));return n.length<2?'0'+n:n};
    var tick=function(){var d=meta-Date.now(); if(d<0)d=0;
      $('cd-d').textContent=pad(Math.floor(d/864e5));
      $('cd-h').textContent=pad(Math.floor(d/36e5)%24);
      $('cd-m').textContent=pad(Math.floor(d/6e4)%60);
      $('cd-s').textContent=pad(Math.floor(d/1e3)%60)};
    tick(); setInterval(tick,1000);
  } else { $('cuenta').style.display='none' }

  var audio=$('audio'), bm=$('musica'), boton=$('lacre');
  if(boton) boton.addEventListener('click',function(){
    if(pl.portada==='sobre'){ sobre.classList.add('roto'); }
    var espera=pl.portada==='sobre'?700:0;
    setTimeout(function(){
      sobre.classList.add('abierto','sal-'+pl.salida);
      document.body.classList.remove('sellado');
      setTimeout(function(){if(sobre.parentNode)sobre.parentNode.removeChild(sobre)},1100);
    },espera);
    if(E.musica){ audio.src=E.musica; audio.volume=.5;
      var pr=audio.play(); if(pr&&pr.then) pr.then(function(){bm.classList.add('visible')})['catch'](function(){}) }
  });
  bm.addEventListener('click',function(){
    if(audio.paused){audio.play();bm.textContent='♪'} else {audio.pause();bm.textContent='✕'}});

  if(navigator.clipboard&&window.isSecureContext&&E.regalos&&E.regalos.banco){
    var bc=$('copiar'); bc.style.display='block';
    bc.addEventListener('click',function(){
      navigator.clipboard.writeText(String(E.regalos.banco).replace(/\D/g,'')).then(function(){
        bc.textContent='Copiado'; setTimeout(function(){bc.textContent='Copiar cuenta'},2000)})['catch'](function(){})});
  }

  if('IntersectionObserver' in window){
    var els=document.querySelectorAll('#heroe > *, main > section:not(#heroe)');
    var ob=new IntersectionObserver(function(es){es.forEach(function(e){
      if(e.isIntersecting){e.target.classList.add('visto');ob.unobserve(e.target)}})},{threshold:.08});
    Array.prototype.forEach.call(els,function(el){el.classList.add('oculta');ob.observe(el)});
  }

  $('form').addEventListener('submit',function(ev){
    ev.preventDefault();
    var b=ev.target.querySelector('button'); b.disabled=true; b.textContent='Enviando…';
    var asiste=$('f-asiste').value;
    var datos={evento:E.nombre,slug:slug,codigo:codigo,pase:pase?pase.nombre:'',
      nombre:$('f-nombre').value,asiste:asiste,lugares:asiste==='si'?$('f-lugares').value:'0',
      mensaje:$('f-mensaje').value,fecha:new Date().toISOString()};
    var fin=function(){
      $('form').style.display='none'; $('gracias').style.display='block';
      if(asiste==='si'){$('gracias-titulo').textContent='Tu lugar está confirmado';
        $('gracias-texto').textContent='Nos vemos el '+String(E.fechaTexto).toLowerCase()+'.'}
      else {$('gracias-titulo').textContent='Gracias por avisar';
        $('gracias-texto').textContent='Te vamos a extrañar.'}};
    if(E.rsvpEndpoint){
      fetch(E.rsvpEndpoint,{method:'POST',mode:'no-cors',
        headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(datos)}).then(fin)['catch'](fin);
    } else if(E.whatsappAnfitrion){
      var t='Confirmación '+E.nombre+': '+datos.nombre+' — '+(asiste==='si'?datos.lugares+' lugares':'no asistirá');
      window.open('https://wa.me/'+E.whatsappAnfitrion+'?text='+encodeURIComponent(t),'_blank'); fin();
    } else { fin() }
  });
}

function arrancar(){
  if(!slug){ location.replace('/#ejemplos'); return }
  fetch('eventos/'+slug+'.json')
    .then(function(r){if(!r.ok)throw 0;return r.json()})
    .then(pintar)
    ['catch'](function(){
